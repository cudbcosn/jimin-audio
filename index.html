<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jimin Audio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f7f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
.player {
  width: 85%;
  max-width: 420px;
  padding: 30px 24px;
  background: white;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 5px 24px rgba(0,0,0,0.06);
}
h1 {
  font-size: 22px;
  font-weight: 500;
}
p {
  font-size: 14px;
  color: #888;
}
audio {
  width: 100%;
  margin-top: 20px;
}
  </style>
</head>
<body>
  <div class="player">
    <h1>Jimin Audio</h1>
    <p>一段值得珍藏的声音</p >
<audio controls playsinline preload="none" style="width:100%; max-width:100%;">
  <source src="https://cudbcosn.github.io/jimin-audio/jimin.mp3" type="audio/mpeg">
  抱歉，你的浏览器暂时无法播放这段音频。
</audio>
  </div>

</html>
